name: release-please
on:
    # !STARTERCONF Choose your preferred event
    # !Option 1: Manual Trigger from GitHub
    # workflow_dispatch:
    # !Option 2: Release on every push on main branch
    push:
        branches:
            - main
jobs:
    release-please:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  release-type: node
